  description: "Read-only static JSON/CSV files describing Taiwan antimicrobial resistance surveillance (Taiwan CDC THAS annual reports) plus provisional antibiotic-use, HAI and international comparison datasets. All endpoints are plain GET requests for static files on GitHub Pages, which serves `Access-Control-Allow-Origin: *`, so they can be fetched from any web origin. Check each envelope's `provisional` flag: provisional datasets are model estimates, not official data."
